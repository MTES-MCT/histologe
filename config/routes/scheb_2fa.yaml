2fa_login:
    path: /2fa
    schemes: [http]
    defaults:
        _controller: "scheb_two_factor.form_controller::form"

2fa_login_check:
    path: /2fa_check
    schemes: [http]

2fa_suivi_login:
    path: /2fa-suivi
    schemes: [http]
    defaults:
        _controller: "scheb_two_factor.form_controller::form"

2fa_suivi_login_check:
    path: /2fa-suivi-check
    schemes: [http]

when@prod:
    2fa_login:
        path: /2fa
        schemes: [https]
        defaults:
            _controller: "scheb_two_factor.form_controller::form"

    2fa_login_check:
        path: /2fa_check
        schemes: [https]

    2fa_suivi_login:
        path: /2fa-suivi
        schemes: [https]
        defaults:
            _controller: "scheb_two_factor.form_controller::form"

    2fa_suivi_login_check:
        path: /2fa-suivi-check
        schemes: [https]
