# See the configuration reference at https://symfony.com/bundles/SchebTwoFactorBundle/6.x/configuration.html
scheb_two_factor:
    two_factor_condition: App\Service\Security\TwoFactorCondition
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
    email:
        enabled: true
        mailer: App\Service\Mailer\AuthCodeMailer
    trusted_device:
        key: "%env(TWO_FACTOR_TRUSTED_DEVICE_KEY)%"
        enabled: true
        lifetime: 2592000 # 30 jours, à garder cohérent avec le libellé du formulaire 2FA
        extend_lifetime: false
        cookie_name: trusted_device
        cookie_secure: true
        cookie_same_site: lax
